<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#101117"/>

  <!-- palimpsest: an older layer of writing, scraped away and overwritten -->
  <g stroke="#5b5f8a" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.26">
    <g transform="rotate(-2 600 315)">
      <path d="M60 70h520M60 118h430M60 166h500M60 214h360M60 262h480M60 310h300M60 358h455M60 406h390M60 454h510M60 502h340M60 550h470M60 598h280"/>
    </g>
  </g>
  <g stroke="#9498de" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.10">
    <g transform="rotate(1.6 600 315)">
      <path d="M700 40h440M700 92h360M700 144h420M700 196h300M700 248h400M700 300h340M700 352h430M700 404h290M700 456h410M700 508h330M700 560h390M700 612h250"/>
    </g>
  </g>

  <!-- methylation mark: the annotation layer that carries identity -->
  <g transform="translate(1000 315)">
    <circle r="150" fill="none" stroke="#9498de" stroke-width="9" opacity="0.30"/>
    <circle r="104" fill="none" stroke="#9498de" stroke-width="6" opacity="0.18"/>
    <circle r="34" fill="#9498de" opacity="0.85"/>
  </g>

  <!-- left-edge fade so type stays legible over the strata -->
  <rect width="820" height="630" fill="url(#veil)"/>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101117" stop-opacity="0.86"/>
      <stop offset="0.72" stop-color="#101117" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#101117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text x="80" y="150" fill="#6d707e" font-family="Menlo, monospace" font-size="21" letter-spacing="7">AGING, READ AS INFORMATION</text>

  <text x="76" y="300" fill="#e4e4ea" font-family="Palatino, Georgia, serif" font-size="104" font-weight="600" letter-spacing="-1">The Palimpsest</text>

  <text x="80" y="372" fill="#a2a4b0" font-family="Palatino, Georgia, serif" font-size="33">Your cells are not wearing out. They are</text>
  <text x="80" y="418" fill="#a2a4b0" font-family="Palatino, Georgia, serif" font-size="33">slowly forgetting who they are.</text>

  <rect x="80" y="492" width="64" height="3" fill="#9498de" opacity="0.7"/>
  <text x="80" y="546" fill="#8f92c9" font-family="Menlo, monospace" font-size="22" letter-spacing="3">thepalimpsest.bio</text>
</svg>
